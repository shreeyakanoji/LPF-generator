"""

-e .
streamlit>=1.30
pandas

"""

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lfpgen"
version = "0.1.0"
description = "Biophysically-grounded LFP generator: LIF spiking network (Brian2) -> realistic multi-channel local field potential, validated against real extracellular recordings."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Your Name" }
]
keywords = ["neuroscience", "LFP", "electrophysiology", "brian2", "spiking-network", "neuropixels"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "brian2>=2.5",
    "numpy>=1.22",
    "scipy>=1.8",
]

[project.optional-dependencies]
allen = ["allensdk"]
dev = ["pytest>=7.0", "matplotlib"]
app = ["streamlit>=1.30", "pandas"]

[project.scripts]
lfpgen = "lfpgen.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/lfpgen"
Issues = "https://github.com/yourusername/lfpgen/issues"

[tool.setuptools.packages.find]
include = ["lfpgen*"]
